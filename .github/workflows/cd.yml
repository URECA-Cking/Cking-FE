name: CD

on:
  push:
    branches: [develop]
  workflow_dispatch:

# 기본은 읽기만 주고, 필요한 권한은 job별로 연다.
permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::551372961758:role/dev-cking-fe-github-actions-role
  S3_BUCKET: dev-cking-frontend-551372961758
  CLOUDFRONT_DISTRIBUTION_ID: E2NQPJU059830V
  API_BASE_URL: https://dev-api.cking.co.kr

jobs:
  deploy:
    name: Build and Deploy to S3
    # develop만 배포한다. 다른 브랜치의 수동 실행은 이 job을 건너뛴다.
    # 실제 차단은 IAM 신뢰 정책(sub = develop)이 하고, 이 조건은 실패가 아닌 skipped로 드러내기 위한 것이다.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC 토큰 발급. AWS 역할을 맡는 데 필요하다.
    # 배포는 취소하지 않는다. S3 동기화 도중 끊기면 일부 파일만 바뀐 상태로 남는다.
    concurrency:
      group: cd-deploy-dev-frontend
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: 빌드
        # Vite 환경변수는 빌드 시점에 번들에 포함된다. 배포본은 개발 프록시가 없어
        # 브라우저가 API를 직접 호출하므로 여기서 주소를 주입한다.
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: S3 동기화
        # --delete로 이전 빌드의 잔여 파일을 지운다. 해시가 붙은 파일명이라 계속 쌓인다.
        run: aws s3 sync dist/ "s3://$S3_BUCKET/" --delete

      - name: CloudFront 캐시 무효화
        # JS·CSS는 파일명에 해시가 붙어 캐시를 타지 않지만 index.html은 이름이 고정이다.
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query Invalidation.Id --output text)
          echo "무효화 요청: $INVALIDATION_ID"
