name: CI

on:
  pull_request:
    branches: [develop, main]
  # 기본 브랜치에서 한 번 돌아야 npm 캐시가 저장되고, 이후 모든 PR이 그걸 재사용한다.
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm run build
