<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="좋아하는 크리에이터의 응모권을 모아 한정판 래플에 참여하는 팬덤 웹앱" />

    <!-- 웹앱(PWA) 설치 및 홈 화면 실행 설정 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a1a1e" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cking" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <!-- 저장된 화면 모드(다크/일반)를 첫 렌더 전에 적용해 새로고침 때 화면이 깜빡이지 않게 한다. 키와 theme-color 값은 src/context/ThemeContext.jsx와 같다. -->
    <script>
      try {
        var theme = localStorage.getItem('cking.theme') === 'light' ? 'light' : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#faf8ff' : '#1a1a1e')
      } catch (e) {}
    </script>
    <title>Cking</title>
    <!-- CSS가 오기 전 새로고침 순간에 흰 화면이 번쩍이지 않게 앱 배경색(surface)을 먼저 깐다. 일반 모드는 위 스크립트가 붙인 data-theme으로 밝은 배경을 깐다. -->
    <style>html{background:#1a1a1e}html[data-theme='light']{background:#faf8ff}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
