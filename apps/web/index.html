<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="좋아하는 크리에이터의 응모권을 모아 한정판 래플에 참여하는 팬덤 웹앱" />

    <!-- 웹앱(PWA) 설치 및 홈 화면 실행 설정 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a1a1e" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cking" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- 앱이 쓰는 축(opsz 24·wght 400·GRAD 0, FILL 0/1)만 받아 약 4MB → 460KB로 줄인다. display=block은 폰트가 오기 전에 아이콘 이름 글자(chevron_right 등)가 보이지 않게 한다. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
      rel="stylesheet"
    />
    <!-- 홈 웰컴 퀘스트의 속이 찬 둥근 아이콘 전용. 필요한 아이콘만 불러와 용량을 줄인다(icon_names는 알파벳순). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=emoji_events,person_add,quiz,redeem,star&display=block"
      rel="stylesheet"
    />
    <!-- 저장된 화면 모드(다크/일반)를 첫 렌더 전에 적용해 새로고침 때 화면이 깜빡이지 않게 한다. 키와 theme-color 값은 src/context/ThemeContext.jsx와 같다. -->
    <script>
      try {
        var theme = localStorage.getItem('cking.theme') === 'light' ? 'light' : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#f5f6f8' : '#1a1a1e')
      } catch (e) {}
    </script>
    <!-- 아이콘 폰트가 늦게 오면 display=block의 차단 시간(약 3초)이 지나 아이콘 이름 글자가 다시 보인다. 폰트가 실제로 받아질 때까지 src/index.css가 아이콘을 숨기도록 받아진 폰트의 클래스를 붙인다. -->
    <script>
      (function () {
        var root = document.documentElement
        function markLoadedIcons() {
          document.fonts.forEach(function (face) {
            if (face.status !== 'loaded') return
            var family = face.family.replace(/["']/g, '')
            if (family === 'Material Symbols Outlined') root.classList.add('icons-outlined-ready')
            if (family === 'Material Symbols Rounded') root.classList.add('icons-rounded-ready')
          })
        }
        try {
          markLoadedIcons()
          document.fonts.addEventListener('loadingdone', markLoadedIcons)
          // iOS에서는 폰트가 loaded가 된 뒤에도 loadingdone으로 확인이 이어지지 않아 아이콘이 계속 숨겨졌다. 폰트를 직접 불러 완료를 기다리고, 주기적으로도 확인한다.
          document.fonts.load('24px "Material Symbols Outlined"', 'home').then(markLoadedIcons, function () {})
          document.fonts.load('24px "Material Symbols Rounded"', 'star').then(markLoadedIcons, function () {})
          document.fonts.ready.then(markLoadedIcons)
          var timer = setInterval(markLoadedIcons, 300)
          // 주기 확인은 10초 뒤 마지막으로 상태만 다시 보고 멈춘다. 폰트가 아직 안 왔으면 숨김을 유지하고(이름 글자 노출 방지), 뒤늦게 오면 loadingdone이 클래스를 붙인다.
          setTimeout(function () {
            clearInterval(timer)
            markLoadedIcons()
          }, 10000)
        } catch (e) {
          // 폰트 로딩 상태를 알 수 없는 브라우저에서는 아이콘을 숨기지 않는다.
          root.classList.add('icons-outlined-ready', 'icons-rounded-ready')
        }
      })()
    </script>
    <title>Cking</title>
    <!-- CSS가 오기 전 새로고침 순간에 흰 화면이 번쩍이지 않게 앱 배경색(surface)을 먼저 깐다. 일반 모드는 위 스크립트가 붙인 data-theme으로 밝은 배경을 깐다. -->
    <style>html{background:#1a1a1e}html[data-theme='light']{background:#f5f6f8}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
